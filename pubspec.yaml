name: onexray
description: "Cross Platform Xray-core Client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  material_ui: ^1.9.0

  #---------- flutter.dev plugin
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  quick_actions: ^1.1.1
  home_widget: ^0.10.0
  go_router: ^18.1.2
  process: ^5.0.6
  app_links: ^7.2.2

  #---------- dart.dev plugin
  # core
  path: ^1.9.1
  collection: ^1.19.1
  crypto: ^3.0.8
  pub_semver: ^2.2.1
  # i18n
  intl: ^0.20.3
  # native
  ffi: ^2.2.0

  #---------- google.dev plugin
  json_annotation: ^4.12.0
  tuple: ^2.0.2

  #---------- flutter community
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1

  #---------- third party plugin
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0

  dio: ^5.11.1
  uuid: ^4.6.0
  # account session tokens in Keychain / Android Keystore
  flutter_secure_storage: ^11.2.0
  permission_handler: ^13.0.2
  # qrcode
  file_picker: ^13.3.1
  # Reuse the existing desktop file-selector implementations for path-only saves.
  file_selector_platform_interface: ^2.7.0
  icloud_storage_plus: ^4.1.2
  saf_stream: ^4.0.3
  image: ^4.12.0
  zxing2: ^0.2.4
  # export
  # state management
  flutter_bloc: ^9.1.1
  shadcn_ui: ^0.57.4
  # shadcn_ui 0.57.4 requires Lucide >=3.0.0 <4.0.0.
  lucide_icons_flutter: ^3.1.25
  # markdown
  flutter_markdown_plus: ^1.0.12
  flutter_local_notifications: ^23.0.0-dev.5
  timezone: ^0.11.2
  in_app_review: ^2.0.12
  # crash reports; unlike Crashlytics, no Google Play Services
  sentry_flutter: ^10.3.0

  isolate_manager: ^6.3.2

  # editor
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # desktop
  nativeapi: ^0.5.7
  tray_manager: ^0.8.2
  # 0.6's Windows backend cannot resolve our hidden startup window reliably.
  window_manager: ^0.5.2
  macos_window_utils: ^1.9.1
  win32: ^6.4.0
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  share_plus_platform_interface: ^7.2.0
  # FlutterGen 5.15.0 requires build 4; build_runner 2.17 uses build 5.
  build_runner: ^2.16.2
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  pigeon: ^29.1.0
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  ffigen: ^23.0.0
  msix: ^3.18.0

# re_editor only uses APIs that remain compatible with isolate_manager 6.x.
dependency_overrides:
  isolate_manager: ^6.3.2

msix_config:
  display_name: OneXray
  publisher_display_name: Yuan Dev LLC
  identity_name: YuanDevLLC.OneXray
  publisher: CN=3666BCB5-5482-46DD-9C19-D8A7290A39FD
  logo_path: assets/logo.png
  # Preserve the blue margin; trimming it makes the X fill Windows app icons.
  trim_logo: false
  protocol_activation: onexray
  languages: en-us
  capabilities: internetClientServer, privateNetworkClientServer, networkingVpnProvider
  startup_task:
    task_id: VoleStartup
    enabled: false
  os_min_version: 10.0.19042.0
  build_windows: false
  store: true

flutter_gen:
  output: lib/gen/

flutter:
  uses-material-design: true
  generate: true

  # The animated backdrop of «Вход», ported from the site.
  shaders:
    - shaders/dark_veil.frag

  # Upstream's artwork stays for its desktop code and merges, but no phone
  # build carries it.
  assets:
    - path: assets/
      platforms: [linux, macos, windows]
    - assets/dat/
    - assets/geodata/regions.json
    - path: assets/icon/
      platforms: [linux, macos, windows]
    - path: assets/app_icon/
      platforms: [linux, macos, windows]
    - path: assets/macos_icon/
      platforms: [linux, macos, windows]
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Unbounded.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
