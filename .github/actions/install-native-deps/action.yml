name: Install native build dependencies
description: Install the Linux packages that FFI generation needs, from a cache when possible

# FFI generation runs cnativeapi's Linux host hook, on Android builds as well.
# Ubuntu mirrors can stall for many minutes, so the packages themselves are
# cached. The week in the key lets them follow package updates.
runs:
  using: composite
  steps:
    - name: Read the current week
      id: week
      shell: bash
      run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-${{ runner.os }}-${{ hashFiles('**/.github/actions/install-native-deps/action.yml') }}-${{ steps.week.outputs.value }}
        restore-keys: apt-${{ runner.os }}-${{ hashFiles('**/.github/actions/install-native-deps/action.yml') }}-

    - name: Install packages
      shell: bash
      run: |
        mkdir -p ~/apt-archives/partial
        apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=10)
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" -o Dir::Cache::archives="$HOME/apt-archives" \
          install -y --no-install-recommends \
          clang pkg-config libgtk-3-dev libx11-dev libxi-dev
        sudo chown -R "$USER" ~/apt-archives
