name: Setup Flutter with caches
description: Install stable Flutter and restore the SDK, pub packages and Dart build state

# A separate action, because setup-flutter is shared with the disabled upstream
# workflows and also supports hosts this repository does not build on.
inputs:
  app-path:
    description: Directory of the Flutter App inside the workspace
    default: .

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        cache: true

    # Both tools track their inputs, so an older restored state only rebuilds
    # what changed. The job is part of the key because paths differ between jobs.
    - uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.app-path }}/.dart_tool/hooks_runner
          ${{ inputs.app-path }}/.dart_tool/build
        key: dart-tool-${{ runner.os }}-${{ github.job }}-${{ hashFiles(format('{0}/pubspec.lock', inputs.app-path)) }}
        restore-keys: dart-tool-${{ runner.os }}-${{ github.job }}-
