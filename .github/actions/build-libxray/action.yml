name: Build libXray
description: Build a pinned libXray commit and copy it with Geodata into this checkout

# build_scripts expects libXray next to the App, so the caller checks out this
# repository to a subdirectory of the workspace.
inputs:
  ref:
    description: libXray commit
    required: true
  system:
    description: android or ios
    required: true

runs:
  using: composite
  steps:
    # The build also downloads Geodata, so the week in the key keeps it recent.
    - name: Read the current week
      id: week
      shell: bash
      run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          launchvpn-client/android/app/libs
          launchvpn-client/swift/all/LibXray.xcframework
          launchvpn-client/assets/dat
        key: libxray-${{ inputs.system }}-${{ inputs.ref }}-${{ hashFiles('launchvpn-client/build_scripts/**/*.py') }}-${{ steps.week.outputs.value }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: XTLS/libXray
        ref: ${{ inputs.ref }}
        path: libXray

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: libXray/go.mod
        cache-dependency-path: libXray/go.sum

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
        check-latest: true

    - name: Build the core
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
      run: python "$GITHUB_ACTION_PATH/../../../build_scripts/build_core.py" "$SYSTEM"
